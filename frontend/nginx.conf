# The container's own DNS server, filled in at startup from /etc/resolv.conf by
# docker-entrypoint.d/15-resolver.envsh. It is read rather than hard-coded so
# that changing the ytmdl-net subnet needs no change here.
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Static assets caching
    # Asset filenames carry a content hash, so they can be cached forever.
    # expires is deliberately not used alongside this: it would emit a second,
    # redundant Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API and SSE proxy to backend container in ytmdl-net.
    #
    # The upstream goes through a variable on purpose. With a literal host in
    # proxy_pass, nginx resolves "backend" once at startup and keeps that
    # address forever — so every request answers 502 as soon as the backend
    # container is recreated with a new IP. A variable defers the lookup to
    # request time, which is why the resolver above is needed.
    location /api/ {
        set $ytmdl_backend http://backend:8080;
        proxy_pass $ytmdl_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for Server-Sent Events (/api/v1/events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    # SPA routing: fallback to index.html
    #
    # index.html must never be cached. It is the only file whose name stays the
    # same across deployments, and it is what names the hashed asset bundles —
    # a cached copy keeps pointing at the previous release's files, so a browser
    # would keep running the old application after an update.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
