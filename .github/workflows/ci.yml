name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Tests, lint and TypeScript/Vite build
        working-directory: frontend
        run: |
          bun test
          bun run lint
          bun run build

      - name: Build documentation
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bun run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ytmdl_test
          POSTGRES_USER: ytmdl
          # Disposable CI service only; never deployment credentials.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytmdl -d ytmdl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MUSICDL_TEST_DATABASE_URL: postgres://ytmdl:ci-only-not-a-secret@127.0.0.1:5432/ytmdl_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install audio and PostgreSQL 18 tools
        timeout-minutes: 8
        run: |
          apt_bounded() {
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 "$@"
          }
          apt_bounded update -qq
          apt_bounded install -y -qq --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          apt_bounded update -qq
          apt_bounded install -y -qq --no-install-recommends postgresql-client-18 ffmpeg libchromaprint-tools
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Formatting, vet and build
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...
      - name: Installation package safety and metadata
        run: |
          python3 scripts/test-installation.py
          scripts/validate-release-metadata.sh
      - name: Tests including PostgreSQL integration
        working-directory: backend
        run: go test -count=1 ./...
      - name: Race tests
        working-directory: backend
        run: go test -race -count=1 ./...

  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Build public application shell
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Prepare isolated Chromium and Firefox
        working-directory: scripts/browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium firefox
      - name: Qualify browser-local copies and offline restart
        run: bun scripts/browser/qualify-offline.mjs frontend/dist

  apple:
    # Official Xcode 27 image (macOS 27, Apple Silicon).
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Xcode and test the native client core
        run: |
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 27([.]|$)'
          swift test --package-path apple --scratch-path "$RUNNER_TEMP/apple-tests"
      - name: Build production configurations without distribution signing
        run: |
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-macOS -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/apple-mac" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-iOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/apple-ios-release" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-tvOS -configuration Release -destination 'generic/platform=tvOS' -derivedDataPath "$RUNNER_TEMP/apple-tv-release" CODE_SIGNING_ALLOWED=NO build
      - name: Test native playback and navigation against loopback fixtures
        run: |
          python3 apple/Scripts/fixture-server.py --port 59583 > "$RUNNER_TEMP/apple-fixture.log" 2>&1 &
          ytmdl_fixture_pid=$!
          trap 'kill "$ytmdl_fixture_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:59583/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          xcrun simctl list devices available --json > "$RUNNER_TEMP/apple-simulators.json"
          python3 - "$RUNNER_TEMP/apple-simulators.json" > "$RUNNER_TEMP/apple-simulators.env" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          for key, runtime, prefix in [('YTMDL_IPHONE_SIM', 'iOS-27-', 'iPhone'), ('YTMDL_IPAD_SIM', 'iOS-27-', 'iPad'), ('YTMDL_TV_SIM', 'tvOS-27-', 'Apple TV')]:
              match = next((d['udid'] for r, ds in devices.items() if runtime in r for d in ds if d['name'].startswith(prefix)), None)
              if not match:
                  raise SystemExit('Required OS 27 simulator is missing: ' + prefix)
              print(key + '=' + match)
          PY
          source "$RUNNER_TEMP/apple-simulators.env"
          for ytmdl_sim in "$YTMDL_IPHONE_SIM" "$YTMDL_IPAD_SIM" "$YTMDL_TV_SIM"; do
            xcrun simctl boot "$ytmdl_sim" || true
            xcrun simctl bootstatus "$ytmdl_sim" -b
          done
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-iOS -destination "platform=iOS Simulator,id=$YTMDL_IPHONE_SIM" -derivedDataPath "$RUNNER_TEMP/apple-ios-ui" CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never -parallel-testing-enabled NO test
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-iOS -destination "platform=iOS Simulator,id=$YTMDL_IPAD_SIM" -derivedDataPath "$RUNNER_TEMP/apple-ios-ui" CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never -parallel-testing-enabled NO test
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-tvOS -destination "platform=tvOS Simulator,id=$YTMDL_TV_SIM" -derivedDataPath "$RUNNER_TEMP/apple-tv-ui" CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never -parallel-testing-enabled NO test
