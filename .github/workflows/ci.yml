name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which parts of the repository a change touches, so that a change to
  # the backend does not occupy macOS runners and three simulators, and a change
  # to the Apple client does not rebuild the web application. A job that is not
  # needed is reported as skipped. When the range cannot be determined, or the
  # workflow itself changed, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          frontend=true; backend=true; apple=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            echo "$changed"
            if ! printf '%s\n' "$changed" | grep -qx '.github/workflows/ci.yml'; then
              # The web application, the documentation site and the browser checks.
              printf '%s\n' "$changed" | grep -qE '^(frontend|docs|scripts/browser)/' || frontend=false
              # The native client.
              printf '%s\n' "$changed" | grep -q '^apple/' || apple=false
              # The backend job also validates release metadata that lives all
              # over the repository, so it only steps aside for a change that
              # stays inside the native client.
              printf '%s\n' "$changed" | grep -qv '^apple/' || backend=false
            fi
          fi
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "apple=$apple"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Restore the package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'docs/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Tests, lint and TypeScript/Vite build
        working-directory: frontend
        run: |
          bun test
          bun run lint
          bun run build

      - name: Build documentation
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bun run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ytmdl_test
          POSTGRES_USER: ytmdl
          # Disposable CI service only; never deployment credentials.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytmdl -d ytmdl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MUSICDL_TEST_DATABASE_URL: postgres://ytmdl:ci-only-not-a-secret@127.0.0.1:5432/ytmdl_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install audio and PostgreSQL 18 tools
        timeout-minutes: 8
        run: |
          apt_bounded() {
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 "$@"
          }
          apt_bounded update -qq
          apt_bounded install -y -qq --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          apt_bounded update -qq
          apt_bounded install -y -qq --no-install-recommends postgresql-client-18 ffmpeg libchromaprint-tools
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Formatting, vet and build
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go build ./...
      - name: Installation package safety and metadata
        run: |
          python3 scripts/test-installation.py
          scripts/validate-release-metadata.sh
      # One run with the race detector covers everything the plain run did: no
      # test is excluded from race builds. Running both executed every test,
      # the PostgreSQL integration included, twice.
      - name: Tests including PostgreSQL integration, with the race detector
        working-directory: backend
        run: go test -race -count=1 ./...

  offline-browser:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Restore the package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-browser-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'scripts/browser/bun.lock') }}
          restore-keys: bun-browser-${{ runner.os }}-
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser/bun.lock') }}
      - name: Build public application shell
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      # The browser builds are large downloads that only change with the
      # Playwright version. Their system libraries are not cached and are
      # installed either way.
      - name: Prepare isolated Chromium and Firefox
        working-directory: scripts/browser
        env:
          BROWSERS_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          bun install --frozen-lockfile
          if [ "$BROWSERS_CACHED" = "true" ]; then
            bunx playwright install-deps chromium firefox
          else
            bunx playwright install --with-deps chromium firefox
          fi
      - name: Qualify browser-local copies and offline restart
        run: bun scripts/browser/qualify-offline.mjs frontend/dist

  # The release workflow signs in, searches, downloads and plays a track in
  # Chromium and Firefox against the packaged stack, and refuses to publish
  # when that fails. Running the same check on pull requests into main shows
  # such a failure before a release tag exists, not after.
  release-browser-flow:
    needs: changes
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser/bun.lock') }}
      - name: Build the candidate images
        run: |
          version="$(tr -d '[:space:]' < .release-version)"
          docker build --file Containerfile --build-arg "VERSION=${version}" --tag ytmdl-backend:ci-candidate .
          docker build --file frontend/Containerfile --tag ytmdl-frontend:ci-candidate frontend
      - name: Prepare isolated Chromium and Firefox
        working-directory: scripts/browser
        env:
          BROWSERS_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          bun install --frozen-lockfile
          if [ "$BROWSERS_CACHED" = "true" ]; then
            bunx playwright install-deps chromium firefox
          else
            bunx playwright install --with-deps chromium firefox
          fi
      - name: Qualify the real browser flow against the packaged stack
        run: |
          python3 scripts/qualify-compose.py \
            --backend ytmdl-backend:ci-candidate \
            --frontend ytmdl-frontend:ci-candidate \
            --browser "${RUNNER_TEMP}/ytmdl-browser.json"
          node scripts/browser/qualify.mjs "${RUNNER_TEMP}/ytmdl-browser.json"

  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # Official Xcode 27 image (macOS 27, Apple Silicon).
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Xcode and test the native client core
        run: |
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode 27([.]|$)'
          python3 apple/Scripts/fixture-server.py --port 59583 > "$RUNNER_TEMP/apple-core-fixture.log" 2>&1 &
          ytmdl_fixture_pid=$!
          trap 'kill "$ytmdl_fixture_pid"' EXIT
          ytmdl_fixture_ready=false
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:59583/api/v1/health > /dev/null; then
              ytmdl_fixture_ready=true
              break
            fi
            sleep 1
          done
          if [ "$ytmdl_fixture_ready" != true ]; then exit 1; fi
          # MediaPlayer metadata and remote commands are process-wide singletons.
          YTMDL_OFFLINE_FIXTURE_URL=http://127.0.0.1:59583 swift test --package-path apple --scratch-path "$RUNNER_TEMP/apple-tests" --no-parallel
      - name: Build production configurations without distribution signing
        run: |
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-macOS -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/apple-mac" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-iOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/apple-ios-release" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apple/YTMDL.xcodeproj -scheme YTMDL-tvOS -configuration Release -destination 'generic/platform=tvOS' -derivedDataPath "$RUNNER_TEMP/apple-tv-release" CODE_SIGNING_ALLOWED=NO build

  apple-ui:
    # Each runner boots one simulator. Three simultaneously booted simulators
    # exhausted the build job's time budget before UI checks could finish.
    runs-on: xcode-27
    needs: apple
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            runtime: iOS-27-
            scheme: YTMDL-iOS
            platform: iOS Simulator
          - device: iPad
            runtime: iOS-27-
            scheme: YTMDL-iOS
            platform: iOS Simulator
          - device: Apple TV
            runtime: tvOS-27-
            scheme: YTMDL-tvOS
            platform: tvOS Simulator
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Boot the selected OS 27 simulator
        timeout-minutes: 10
        env:
          YTMDL_SIM_RUNTIME: ${{ matrix.runtime }}
          YTMDL_SIM_DEVICE: ${{ matrix.device }}
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/apple-simulators.json"
          python3 - "$RUNNER_TEMP/apple-simulators.json" > "$RUNNER_TEMP/apple-selected.env" <<'PYTHON'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))['devices']
          match = next((d['udid'] for r, ds in devices.items()
                        if os.environ['YTMDL_SIM_RUNTIME'] in r
                        for d in ds if d['name'].startswith(os.environ['YTMDL_SIM_DEVICE'])), None)
          if not match:
              raise SystemExit('Required OS 27 simulator is missing')
          print('YTMDL_TEST_SIM=' + match)
          PYTHON
          cat "$RUNNER_TEMP/apple-selected.env" >> "$GITHUB_ENV"
          source "$RUNNER_TEMP/apple-selected.env"
          xcrun simctl bootstatus "$YTMDL_TEST_SIM" -b
      - name: Test native playback and navigation against loopback fixtures
        env:
          YTMDL_TEST_SCHEME: ${{ matrix.scheme }}
          YTMDL_TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 apple/Scripts/fixture-server.py --port 59583 --audit-failures > "$RUNNER_TEMP/apple-fixture.log" 2>&1 &
          ytmdl_fixture_pid=$!
          trap 'kill "$ytmdl_fixture_pid"' EXIT
          ytmdl_fixture_ready=false
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:59583/api/v1/health > /dev/null; then
              ytmdl_fixture_ready=true
              break
            fi
            sleep 1
          done
          if [ "$ytmdl_fixture_ready" != true ]; then exit 1; fi
          run_ui_tests() {
            rm -rf "$RUNNER_TEMP/apple-ui-results.xcresult"
            set -o pipefail
            xcodebuild -project apple/YTMDL.xcodeproj -scheme "$YTMDL_TEST_SCHEME" -destination "platform=$YTMDL_TEST_PLATFORM,id=$YTMDL_TEST_SIM" -derivedDataPath "$RUNNER_TEMP/apple-ui" -resultBundlePath "$RUNNER_TEMP/apple-ui-results.xcresult" CODE_SIGNING_ALLOWED=NO -collect-test-diagnostics never -parallel-testing-enabled NO test 2>&1 | tee "$RUNNER_TEMP/apple-ui-xcodebuild.log"
          }
          if run_ui_tests; then exit 0; fi
          # A simulator that could not start the test runner, or whose runtime
          # went away, says nothing about the application. Those two failures
          # get one more attempt on a freshly booted simulator; a failing test
          # is never retried.
          if grep -qE 'Failed to install or launch the test runner|simulator runtime is not available' "$RUNNER_TEMP/apple-ui-xcodebuild.log"; then
            echo "::warning::The simulator failed before or outside the tests; retrying once on a fresh boot."
            xcrun simctl shutdown "$YTMDL_TEST_SIM" || true
            xcrun simctl bootstatus "$YTMDL_TEST_SIM" -b
            run_ui_tests
          else
            exit 1
          fi
      - name: Export failed fixture screenshots
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/apple-ui-results.xcresult" ]; then
            # Screenshots attached to test activities are omitted by
            # --only-failures on this Xcode version. Export PNGs from the
            # fixture run; upload excludes manifests and issue descriptions.
            xcrun xcresulttool export attachments --filter '*.png' --path "$RUNNER_TEMP/apple-ui-results.xcresult" --output-path "$RUNNER_TEMP/apple-ui-failure-images"
          fi
      - name: Preserve fixture screenshots for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-ui-failure-${{ matrix.device }}
          # Only PNGs from loopback fixture tests: no raw result bundles,
          # simulator diagnostics, attachment manifests or logs.
          path: ${{ runner.temp }}/apple-ui-failure-images/**/*.png
          if-no-files-found: ignore
          retention-days: 7
