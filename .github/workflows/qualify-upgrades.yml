name: Managed Upgrade Qualification Legs

# Reusable: scripts/qualify-upgrade.py for every source version at once, one
# runner per source running each engine in turn. Called by release.yml (against
# the run's candidate images) and by upgrade-qualification.yml (against
# published images or the candidates of an earlier release run).
#
# Each leg is its own runner, so the subnet compose.ghcr.yaml pins for
# ytmdl-net (172.31.250.0/28) is never shared between concurrent scenarios.
# Within a leg the engines run one after the other, exactly as the former
# sequential loop did, and qualify-upgrade.py proves its teardown in between.
#
# The caller uploads an artifact holding exactly what the harness serves as
# the release: ytmdlctl-* binaries, SHA256SUMS and release-manifest.json.
# Every leg that passes uploads upgrade-result-<attempt>-<source>.json so the
# caller can check that every source was qualified, not just that no leg
# failed.

on:
  workflow_call:
    inputs:
      target:
        description: 'Target version the manifest describes'
        type: string
        required: true
      sources:
        description: 'JSON array of source versions, one leg each'
        type: string
        required: true
      engines:
        description: 'Space-separated engines, run in this order in every leg'
        type: string
        required: false
        default: 'docker podman'
      inputs_artifact:
        description: 'Artifact with ytmdlctl-*, SHA256SUMS and release-manifest.json'
        type: string
        required: true
      stage_target:
        description: 'Pull the manifest images by digest and tag them as the target locally (candidates without a version tag)'
        type: boolean
        required: false
        default: false
      expected_attempt:
        description: 'If set, legs refuse to run in any other run attempt (release.yml: the attempt that pushed the candidates)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  upgrade:
    name: Upgrade from v${{ matrix.source }}
    # Pinned (not ubuntu-latest): the release qualification is only proven on this
    # image. Changing it means re-running upgrade-qualification.yml first.
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      # Every leg runs to its end, so a failure shows all affected sources.
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.sources) }}
    env:
      SOURCE: ${{ matrix.source }}
      TARGET: ${{ inputs.target }}
      ENGINES: ${{ inputs.engines }}
      EXPECTED_ATTEMPT: ${{ inputs.expected_attempt }}
    steps:
      - name: Check Run Attempt and Inputs
        shell: bash
        run: |
          set -euo pipefail
          # A partial re-run ("Re-run failed jobs") reuses the outputs of the
          # jobs that passed, but the earlier attempt deleted its candidate
          # images when it failed. Refuse rather than qualify anything else
          # than what this attempt pushed and will promote.
          if [ -n "${EXPECTED_ATTEMPT}" ] && [ "${GITHUB_RUN_ATTEMPT}" != "${EXPECTED_ATTEMPT}" ]; then
            echo "::error::The candidates were pushed in attempt ${EXPECTED_ATTEMPT}; this is attempt ${GITHUB_RUN_ATTEMPT}. Use 'Re-run all jobs'." >&2
            exit 1
          fi
          [[ "${SOURCE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid source '${SOURCE}'" >&2; exit 1; }
          [[ "${TARGET}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || { echo "::error::Invalid target '${TARGET}'" >&2; exit 1; }
          [ -n "${ENGINES// /}" ] || { echo "::error::No engine given" >&2; exit 1; }
          for engine in ${ENGINES}; do
            [[ "${engine}" =~ ^(docker|podman)$ ]] || { echo "::error::Invalid engine '${engine}'" >&2; exit 1; }
          done

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Release Inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.inputs_artifact }}
          path: dist

      - name: Verify Release Inputs
        shell: bash
        run: |
          set -euo pipefail
          # Artifacts do not keep the executable bit; the checksums prove the
          # binaries are the ones the release job built.
          (cd dist && sha256sum --ignore-missing -c SHA256SUMS)
          chmod +x dist/ytmdlctl-*
          jq -e --arg v "${TARGET}" '.release_version == $v' dist/release-manifest.json >/dev/null \
            || { echo "::error::release-manifest.json does not describe ${TARGET}" >&2; exit 1; }
          dist/ytmdlctl-linux-amd64 version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Old ytmdlctl (v0.28.0)
        shell: bash
        run: |
          set -euo pipefail
          old_cli_dir="${RUNNER_TEMP}/ytmdl-old-cli"
          mkdir -p "${old_cli_dir}"
          curl -fsSL --connect-timeout 15 --max-time 120 --retry 2 \
            https://github.com/Der-Felix/ytmdl/releases/download/v0.28.0/ytmdlctl-linux-amd64 -o "${old_cli_dir}/ytmdlctl-linux-amd64"
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 \
            https://github.com/Der-Felix/ytmdl/releases/download/v0.28.0/SHA256SUMS -o "${old_cli_dir}/SHA256SUMS"
          (cd "${old_cli_dir}" && sha256sum --ignore-missing -c SHA256SUMS)
          chmod +x "${old_cli_dir}/ytmdlctl-linux-amd64"

      - name: Set up Rootless Podman
        if: contains(inputs.engines, 'podman')
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          # As in release.yml ("Qualify Rootless Podman Compose Package"). The
          # package lists are refreshed first: this runner has run no apt
          # update of its own.
          apt_bounded() {
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 "$@"
          }
          apt_bounded update -qq
          apt_bounded install -y -qq podman uidmap slirp4netns
          provider=""
          for path in /usr/libexec/docker/cli-plugins/docker-compose /usr/lib/docker/cli-plugins/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose; do
            if [ -x "${path}" ]; then provider="${path}"; break; fi
          done
          if [ -z "${provider}" ]; then provider="$(command -v docker-compose)"; fi
          echo "PODMAN_COMPOSE_PROVIDER=${provider}" >> "$GITHUB_ENV"
          podman info --format '{{.Host.Security.Rootless}}' | grep -qx true
          podman system service --time=0 > "${RUNNER_TEMP}/podman-service.log" 2>&1 &
          podman version
          podman info --format 'network backend: {{.Host.NetworkBackend}}; rootless network cmd: {{.Host.RootlessNetworkCmd}}'
          "${provider}" version

      - name: Qualify Real Upgrade from v${{ matrix.source }}
        shell: bash
        env:
          STAGE_TARGET: ${{ inputs.stage_target }}
        run: |
          set -euo pipefail
          stage=()
          if [ "${STAGE_TARGET}" = "true" ]; then stage=(--stage-target); fi
          for engine in ${ENGINES}; do
            echo "::group::${engine} ${SOURCE} -> ${TARGET}"
            python3 scripts/qualify-upgrade.py --engine "${engine}" \
              --cli "${PWD}/dist/ytmdlctl-linux-amd64" \
              --source "${SOURCE}" \
              --target "${TARGET}" \
              --manifest "${PWD}/dist/release-manifest.json" \
              --old-cli "${RUNNER_TEMP}/ytmdl-old-cli/ytmdlctl-linux-amd64" \
              "${stage[@]}"
            echo "::endgroup::"
          done
          mkdir -p "${RUNNER_TEMP}/upgrade-result"
          jq -n --arg source "${SOURCE}" --arg target "${TARGET}" --arg engines "${ENGINES}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg manifest "$(sha256sum dist/release-manifest.json | cut -d' ' -f1)" \
            '{source: $source, target: $target, engines: ($engines | split(" ") | map(select(. != ""))), run_attempt: $attempt, manifest_sha256: $manifest}' \
            > "${RUNNER_TEMP}/upgrade-result/upgrade-result-${SOURCE}.json"
          cat "${RUNNER_TEMP}/upgrade-result/upgrade-result-${SOURCE}.json"

      - name: Record Leg Result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-result-${{ github.run_attempt }}-${{ matrix.source }}
          path: ${{ runner.temp }}/upgrade-result/upgrade-result-${{ matrix.source }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Engine State After Qualification
        if: always()
        shell: bash
        run: |
          for engine in podman docker; do
            command -v "${engine}" >/dev/null || continue
            echo "== ${engine} networks"
            "${engine}" network ls || true
            for network in $("${engine}" network ls --format '{{.Name}}' 2>/dev/null | grep '^ytmdl-' || true); do
              "${engine}" network inspect "${network}" || true
            done
            echo "== ${engine} containers"
            "${engine}" ps -a --format '{{.ID}} {{.Names}} {{.Status}} {{.Labels}}' || true
          done
          echo "== podman system service log (tail)"
          tail -n 200 "${RUNNER_TEMP}/podman-service.log" 2>/dev/null || true
