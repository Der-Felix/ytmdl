name: Upgrade Qualification (verify only)

# Runs scripts/qualify-upgrade.py, the managed-update check that release.yml
# runs against its candidate images before they get the version tag, against
# an ALREADY PUBLISHED target version, or against the candidate-* images a
# release run left behind (input "candidate"). It builds ytmdlctl from the
# checked-out commit, writes a release manifest from the real GHCR digests and
# updates disposable installations under Docker and rootless Podman, one
# runner per source version, all at once (qualify-upgrades.yml, the same legs
# release.yml runs).
#
# It never publishes: no image push, no tag, no release. The only token
# permissions are reading the repository and pulling packages.
#
# workflow_dispatch only works once this file is on the default branch, so a
# push trigger on the harness branch lets the check run before a merge.

on:
  push:
    branches:
      - fix/podman-upgrade-qualification
    paths:
      - .github/workflows/upgrade-qualification.yml
      - .github/workflows/qualify-upgrades.yml
      - scripts/qualify-upgrade.py
      - scripts/upgrade-sources.json
      - scripts/install.py
      - compose.ghcr.yaml
      - compose.ghcr.podman.yaml
      - backend/cmd/ytmdlctl/**
  workflow_dispatch:
    inputs:
      target:
        description: 'Published target version (its GHCR images must exist)'
        type: string
        required: true
        default: '1.9.0'
      sources:
        description: 'Space-separated source versions; empty means every version in scripts/upgrade-sources.json'
        type: string
        required: false
        default: ''
      engines:
        description: 'Space-separated engines (docker, podman)'
        type: string
        required: true
        default: 'docker podman'
      candidate:
        description: 'Optional candidate-* tag of a release run; its images are staged locally as the target version, as release.yml does'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: upgrade-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build ytmdlctl and Release Manifest
    # Pinned (not ubuntu-latest): the release qualification is only proven on this
    # image. Changing it means re-running upgrade-qualification.yml first.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      target: ${{ steps.inputs.outputs.target }}
      sources: ${{ steps.inputs.outputs.sources }}
      engines: ${{ steps.inputs.outputs.engines }}
      stage_target: ${{ steps.inputs.outputs.stage_target }}
      inputs_artifact: ${{ steps.inputs.outputs.inputs_artifact }}
    env:
      TARGET: ${{ inputs.target || '1.9.0' }}
      SOURCES: ${{ inputs.sources || '' }}
      ENGINES: ${{ inputs.engines || 'docker podman' }}
      CANDIDATE: ${{ inputs.candidate || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || { echo "::error::Invalid target '${TARGET}'" >&2; exit 1; }
          if [ -z "${SOURCES// /}" ]; then
            sources="$(jq -c . scripts/upgrade-sources.json)"
          else
            sources="$(printf '%s\n' ${SOURCES} | jq -R . | jq -cs 'unique')"
          fi
          echo "${sources}" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' >/dev/null \
            || { echo "::error::Invalid sources ${sources}" >&2; exit 1; }
          [ -n "${ENGINES// /}" ] || { echo "::error::No engine given" >&2; exit 1; }
          for engine in ${ENGINES}; do
            [[ "${engine}" =~ ^(docker|podman)$ ]] || { echo "::error::Invalid engine '${engine}'" >&2; exit 1; }
          done
          if [ -n "${CANDIDATE}" ] && [[ ! "${CANDIDATE}" =~ ^candidate-[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid candidate tag '${CANDIDATE}'" >&2
            exit 1
          fi
          if [[ "${TARGET}" == *-rc.* ]]; then
            echo "::error::Release candidates need a v4 manifest with a source commit; this check covers stable targets." >&2
            exit 1
          fi
          stage_target=false
          if [ -n "${CANDIDATE}" ]; then stage_target=true; fi
          {
            echo "target=${TARGET}"
            echo "sources=${sources}"
            echo "engines=$(echo ${ENGINES})"
            echo "stage_target=${stage_target}"
            echo "inputs_artifact=upgrade-inputs-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
          echo "Target ${TARGET}, sources ${sources}, engines ${ENGINES}"

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: Resolve Published Target Digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          for component in backend frontend; do
            ref="ghcr.io/der-felix/ytmdl-${component}:${CANDIDATE:-${TARGET}}"
            index="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest')"
            raw="$(docker buildx imagetools inspect --raw "${ref}")"
            amd64="$(echo "${raw}" | jq -r '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux") | .digest')"
            arm64="$(echo "${raw}" | jq -r '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux") | .digest')"
            for d in "${index}" "${amd64}" "${arm64}"; do
              if [[ ! "${d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Invalid ${component} digest '${d}' for ${ref}" >&2
                exit 1
              fi
            done
            echo "${ref}: index ${index}, linux/amd64 ${amd64}, linux/arm64 ${arm64}"
            echo "${component}=${index}" >> "$GITHUB_OUTPUT"
            echo "${component}_amd64=${amd64}" >> "$GITHUB_OUTPUT"
            echo "${component}_arm64=${arm64}" >> "$GITHUB_OUTPUT"
          done

      - name: Build ytmdlctl and Release Manifest
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          BACKEND_AMD64: ${{ steps.digests.outputs.backend_amd64 }}
          BACKEND_ARM64: ${{ steps.digests.outputs.backend_arm64 }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
          FRONTEND_AMD64: ${{ steps.digests.outputs.frontend_amd64 }}
          FRONTEND_ARM64: ${{ steps.digests.outputs.frontend_arm64 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C backend build -trimpath \
            -ldflags "-s -w -X 'main.version=${TARGET}' -X 'main.commit=${GITHUB_SHA}' -X 'main.date=${build_date}'" \
            -o "${PWD}/dist/ytmdlctl-linux-amd64" ./cmd/ytmdlctl
          (cd dist && sha256sum ytmdlctl-linux-amd64 > SHA256SUMS)
          # The schema is the newest migration of the checked-out commit: what
          # qualify-upgrade.py expects the updated installation to report.
          schema="$(find backend/internal/database/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort -n | tail -n 1 | sed 's/^0*//')"
          [[ "${schema}" =~ ^[0-9]+$ ]] || { echo "::error::No migration found" >&2; exit 1; }
          # Otherwise the same arguments as release.yml for a stable release.
          go run -C backend ./cmd/ytmdlctl manifest-gen \
            --version "${TARGET}" \
            --tag "v${TARGET}" \
            --manifest-version 3 \
            --schema "${schema}" \
            --min-upgrade 0.15.0 \
            --backend-digest "${BACKEND_DIGEST}" \
            --backend-platform "linux/amd64=${BACKEND_AMD64}" \
            --backend-platform "linux/arm64=${BACKEND_ARM64}" \
            --frontend-digest "${FRONTEND_DIGEST}" \
            --frontend-platform "linux/amd64=${FRONTEND_AMD64}" \
            --frontend-platform "linux/arm64=${FRONTEND_ARM64}" \
            --output "${PWD}/dist/release-manifest.json"
          cat dist/release-manifest.json

      - name: Hand Over Upgrade Qualification Inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.inputs.outputs.inputs_artifact }}
          path: |
            dist/ytmdlctl-linux-amd64
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  upgrade:
    name: Qualify Managed Upgrades
    needs: prepare
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/qualify-upgrades.yml
    with:
      target: ${{ needs.prepare.outputs.target }}
      sources: ${{ needs.prepare.outputs.sources }}
      engines: ${{ needs.prepare.outputs.engines }}
      inputs_artifact: ${{ needs.prepare.outputs.inputs_artifact }}
      stage_target: ${{ needs.prepare.outputs.stage_target == 'true' }}
      # Nothing is promoted here, so re-running only the failed legs is
      # allowed: they qualify the same artifact against the same images.
      expected_attempt: ''
