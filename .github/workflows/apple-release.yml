name: Apple packages

# Packages the native Apple apps for installing WITHOUT the App Store: an unsigned
# iPhone/iPad .ipa for sideloading and a macOS .dmg with an ad-hoc signed app.
# No Apple account, certificate, provisioning profile or secret is used or needed.
#
# - workflow_dispatch: builds and keeps the files as a workflow artifact only.
#   (GitHub lists a manually dispatched workflow once this file is on the default branch.)
# - push of a tag apple-v<version>-<build>: builds, then creates a DRAFT prerelease.
#   Publishing the draft is a manual step. The tag is apple-v*, never v*: the server
#   release workflow and the server's update check only look at v* tags.
on:
  push:
    tags:
      - 'apple-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build unsigned packages
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check the tag against the app version and the branch
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          source apple/Scripts/release-info.sh
          if [ "$TAG" != "$release_tag" ]; then
            echo "::error::Tag $TAG does not match the app version; expected $release_tag (Resources/Info.plist)."
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/dev:refs/remotes/origin/dev' '+refs/heads/main:refs/remotes/origin/main'
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main || git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "Verified: $GITHUB_SHA is on origin/dev or origin/main."
          else
            echo "::error::Tag $TAG ($GITHUB_SHA) is on neither origin/dev nor origin/main; only reviewed commits are released."
            exit 1
          fi

      - name: Build the .ipa and the .dmg
        run: |
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/packages"
          apple/Scripts/package-ipa.sh "$RUNNER_TEMP/packages"
          apple/Scripts/package-dmg.sh "$RUNNER_TEMP/packages"
          cd "$RUNNER_TEMP/packages"
          shasum -a 256 *.ipa *.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create the draft prerelease
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Refuse to touch an existing release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists. Refusing to overwrite it."
            exit 1
          fi

      - name: Download and re-verify the packages
        run: |
          gh run download "$GITHUB_RUN_ID" --name apple-packages --dir packages
          cd packages
          sha256sum -c SHA256SUMS
          ls -l

      - name: Create the draft prerelease
        run: |
          rest="${TAG#apple-v}"
          build="${rest##*-}"
          version="${rest%-*}"
          cat > notes.md <<EOF
          Native Apple apps, preview ${version} (build ${build}). **Unsigned: no Apple developer account is involved.**

          | File | For | How |
          | --- | --- | --- |
          | \`YTMDL-iOS-${version}-${build}-unsigned.ipa\` | iPhone, iPad | Sideload with your own Apple ID (AltStore, SideStore, Sideloadly or Xcode) |
          | \`YTMDL-macOS-${version}-${build}.dmg\` | Mac | Open the disk image, drag YTMDL to Applications, then allow it once under System Settings > Privacy & Security |

          Apple TV has no download: build it from source with Xcode. Requires OS 27 and your own YTMDL server (HTTPS).
          Check every download against \`SHA256SUMS\`. Step by step: [apple/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/apple/INSTALL.md).

          The native apps and the server have independent version numbers; this release is not a server release.
          EOF
          gh release create "$TAG" \
            --verify-tag --draft --prerelease --latest=false \
            --title "YTMDL Apple apps ${version} (${build})" \
            --notes-file notes.md \
            packages/*
